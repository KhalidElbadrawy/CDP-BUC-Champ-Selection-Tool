{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:560px"><h1>{{ _("Request a fresh access link") }}</h1>
<p>Enter the work email address you use for the CDP Champion programme. If it is recognised, we will email you a new secure link. No password is needed.</p>
<form method="post" action="/access"><label for="email">{{ _("Work email") }}</label>
<input id="email" name="email" type="email" required autocomplete="email">
<div class="actions"><button>{{ _("Send link") }}</button></div></form></div>
{% endblock %}
