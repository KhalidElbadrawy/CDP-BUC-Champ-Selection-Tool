<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAUNCH WINDOW</title>
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<link rel="preload" as="image" href="/static/launch/img/pad.webp">
<link rel="stylesheet" href="/static/launch/launch.css">
</head>
<body>
<div id="lw" class="lw phase-intro" data-csrf="{{ csrf }}" data-lang="{{ lang }}">
  <div class="lw-bg" id="lw-bg" aria-hidden="true"><div class="lw-bg-img" id="lw-bg-img"></div><canvas id="lw-fx"></canvas><div class="lw-cones" id="lw-cones"><i></i><i></i><i></i><i></i></div></div>
  <div class="lw-grain" aria-hidden="true"></div>
  <div class="lw-vignette" aria-hidden="true"></div>
  <div class="lw-alert-wash" aria-hidden="true"></div>
  <div class="lw-letterbox" aria-hidden="true"><i></i><i></i></div>

  <header class="lw-hud" id="lw-hud">
    <div class="lw-brand">LAUNCH WINDOW<span class="ar">نافذة الإطلاق</span></div>
    <div class="lw-clock" id="lw-clock" role="timer" aria-live="off"><b id="lw-t">T−60:00</b><span id="lw-t-label"></span></div>
    <div class="lw-meters">
      <div class="lw-meter" id="m-trust"><span class="lbl"></span><div class="bar"><i></i></div><b></b></div>
      <div class="lw-meter" id="m-ready"><span class="lbl"></span><div class="bar"><i></i></div><b></b></div>
      <div class="lw-chip" id="m-crew"></div>
      <div class="lw-chip" id="m-check"></div>
    </div>
    <div class="lw-tools">
      <button class="lw-tool" id="lw-whatnow" type="button"></button>
      <button class="lw-tool" id="lw-sound" type="button" aria-pressed="true"></button>
      <button class="lw-tool" id="lw-lang" type="button"></button>
    </div>
  </header>

  <div class="lw-objective" id="lw-objective" role="status" aria-live="polite"><span class="beacon" aria-hidden="true"></span><span id="lw-objective-text"></span><span class="lw-timer" id="lw-timer" hidden><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.5"/><circle class="ring" id="lw-ring" cx="18" cy="18" r="15.5"/></svg><b id="lw-timer-s"></b></span></div>

  <main class="lw-stage" id="lw-stage" tabindex="-1"></main>

  <div class="lw-feedback" id="lw-feedback" role="status" aria-live="polite" hidden></div>
  <div class="lw-error" id="lw-error" role="alert" hidden></div>
  <div class="lw-caption" id="lw-caption" aria-live="polite" hidden><span class="who" id="lw-caption-who"></span><span id="lw-caption-text"></span></div>
</div>
<noscript><p style="color:#fff;padding:24px;font-family:sans-serif">LAUNCH WINDOW needs JavaScript. Please ask for the written version.</p></noscript>
<script src="/static/launch/launch.js"></script>
</body>
</html>
